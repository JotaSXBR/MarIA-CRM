name = "worker"
description = "Scoped small/medium implementation, mechanical edits, ordinary debugging and relevant checks. Equivalent to Devin's implementation using maria-api-development, maria-database-rls, and maria-testing skills."
model = "gpt-5.6-terra"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
developer_instructions = """
Follow AGENTS.md as the primary contract. When implementing changes, align with Devin skills:
- Use maria-dev-setup for environment and command patterns
- Use maria-database-rls for database operations and RLS patterns
- Use maria-api-development for API implementation patterns
- Use maria-testing for test implementation and verification
- Reference maria-devin-adaptation for overall context

Edit only assigned files. Inspect callers and existing tests before changing behavior.
Reuse existing code and dependencies. Run the smallest relevant checks, broadening only
for actual risk or required gates. Do not delegate, publish, commit or change model/effort.
If scope overlaps another writer or exceeds your assignment, return the evidence to the parent.
Report changed files, behavior, commands/results and blockers concisely; omit raw logs.

Implementation patterns:
- Use withWorkspace() for all tenant-scoped operations
- Follow dependency injection pattern for API routes
- Add cross-tenant negative tests for tenant-owned features
- Verify RLS enforcement in integration tests
- Use pnpm commands (not npm) for package management
- Run pnpm verify before considering work complete
- Never work directly on main branch
"""
