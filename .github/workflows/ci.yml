name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate local Compose configuration
        run: docker compose -f docker/compose.yaml config --quiet
        env:
          POSTGRES_PASSWORD: compose-config-validation-only
          REDIS_PASSWORD: compose-config-validation-only
          WAHA_API_KEY: compose-config-validation-only
          WAHA_DASHBOARD_PASSWORD: compose-config-validation-only
          WAHA_SWAGGER_PASSWORD: compose-config-validation-only
      - run: pnpm verify
      - run: pnpm audit --prod
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t maria-api:ci .
      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          network=""
          postgres=""
          container=""
          trap 'test -z "$container" || { docker logs "$container" 2>/dev/null || true; docker rm -f "$container" >/dev/null 2>&1 || true; }; test -z "$postgres" || docker rm -f "$postgres" >/dev/null 2>&1 || true; test -z "$network" || docker network rm "$network" >/dev/null 2>&1 || true' EXIT
          network=$(docker network create maria-ci)
          postgres=$(docker run -d --network "$network" --name maria-postgres-ci -p 127.0.0.1::5432 \
            -e POSTGRES_DB=maria \
            -e POSTGRES_USER=maria_admin \
            -e POSTGRES_PASSWORD=postgres \
            postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af)
          for attempt in {1..30}; do
            # Force TCP (-h): the postgres image's initdb phase serves the unix
            # socket before the real server starts, so a socket-level
            # pg_isready would race the post-init restart and drop the migrate
            # connection. Then prove a real query succeeds over TCP.
            docker exec maria-postgres-ci pg_isready -h 127.0.0.1 -p 5432 -U maria_admin -d maria \
              && docker exec maria-postgres-ci psql "host=127.0.0.1 user=maria_admin dbname=maria" -c "SELECT 1" >/dev/null \
              && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          postgres_port=$(docker port maria-postgres-ci 5432/tcp | sed 's/.*://')
          MIGRATION_DATABASE_URL="postgres://maria_admin:postgres@127.0.0.1:${postgres_port}/maria" \
            RUNTIME_DATABASE_PASSWORD=runtime \
            pnpm --filter @maria/database db:migrate -- --provision-runtime
          container=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network "$network" \
            -e DATABASE_URL=postgres://maria_runtime:runtime@maria-postgres-ci:5432/maria \
            -e ADMIN_EMAIL=admin@example.com \
            -e ADMIN_PASSWORD=admin-password \
            -p 127.0.0.1::3000 \
            maria-api:ci)
          test "$(docker exec "$container" node --version)" = "v24.21.0"
          test "$(docker exec "$container" id -u)" != "0"
          address=$(docker port "$container" 3000/tcp)
          for attempt in {1..20}; do
            response=$(curl --fail --silent --show-error "http://$address/health" 2>/dev/null) && break
            if [ "$attempt" -eq 20 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          test "$response" = '{"status":"ok"}'
          SMOKE_ADDRESS="http://$address" node scripts/smoke-container.mjs
          docker stop --timeout 10 "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = "0"
